name: OTA Update (fast, no APK)

# Every push to main with JS/TS changes → published to the app in ~2 minutes.
# No APK build needed. Phones pick it up on next app open (and Settings → Updates).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # EXPO_PUBLIC_* values are baked into the JS bundle at publish time
      - name: Create .env file
        run: |
          cat > .env << ENVEOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ENVEOF

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing — add it in GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: |
          eas update --branch preview --platform android --message "$MSG" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}

      # The app asks for CHANNEL "preview". A channel is NOT created by `eas update`
      # (builds made outside EAS Build never create one) → link it to the branch here.
      - name: Link channel "preview" to branch "preview"
        run: |
          eas channel:create preview --non-interactive || true
          eas channel:edit preview --branch preview --non-interactive
          eas channel:view preview --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
