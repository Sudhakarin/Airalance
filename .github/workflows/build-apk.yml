name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Create .env file
        run: |
          cat > .env << ENVEOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ENVEOF
          echo "=== .env created ==="
          cat .env

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_UPDATE_CHANNEL: preview

      # ✅ Bump Gradle heap to prevent OOM during lint
      - name: Increase Gradle Heap
        run: |
          echo "" >> android/gradle.properties
          echo "# CI memory bump to prevent OOM" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      # ✅ TypeScript check — catch code errors before Gradle
      - name: TypeScript check
        run: npx tsc --noEmit

      # ✅ Build with stacktrace for debugging
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "=== BUILD FAILED — Last 300 lines ==="
            tail -300 build.log
            echo "=== FAILURE lines ==="
            grep -A 20 -i "FAILURE\|What went wrong\|error:" build.log | head -100
          fi
          exit $exit_code
        env:
          EXPO_UPDATE_CHANNEL: preview
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Publish EAS Update (OTA)
        if: github.ref == 'refs/heads/main'
        run: |
          eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airalance-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ✅ Upload build log even on failure (for debugging)
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: android/build.log
          retention-days: 7
