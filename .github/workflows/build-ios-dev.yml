name: Build iOS DEV Client (Unsigned)

# AUTOMATIC: jab native-related file badle tab khud chalega
# (JS/screen code badalne pe build ki zaroorat nahi, wo Metro se live reload hota hai)
# Manually bhi chala sakte ho: Actions > is workflow > Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'plugins/**'
      - '*.plist'
      - '.github/workflows/build-ios-dev.yml'
  workflow_dispatch:

# Naya push aaye to purani build cancel (macOS minutes bachte hain)
concurrency:
  group: ios-dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios-dev:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # expo-dev-client na ho to install kar do (sirf is runner pe)
      - name: Ensure expo-dev-client
        run: |
          if ! node -e "require.resolve('expo-dev-client')" 2>/dev/null; then
            echo "expo-dev-client missing, installing..."
            npx expo install expo-dev-client
          else
            echo "expo-dev-client already installed"
          fi

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS DEV Client (Debug, Unsigned)
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -r Airalance-dev-unsigned.ipa Payload

      - name: Upload DEV IPA
        uses: actions/upload-artifact@v4
        with:
          name: Airalance-ipa-DEV-unsigned
          path: ios/Airalance-dev-unsigned.ipa
          retention-days: 7

      # IPA ka fixed download link: Repo > Releases > "iOS DEV client (latest)"
      # Phone ke Safari se seedha download ho jata hai, artifact zip nahi
      - name: Publish IPA to Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest ios/Airalance-dev-unsigned.ipa \
            --title "iOS DEV client (latest)" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}. Install this IPA, then run Metro on the VM: npx expo start --dev-client --tunnel" \
            --prerelease
